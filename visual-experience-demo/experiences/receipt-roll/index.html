<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Receipt Roll</title>
  <meta name="description" content="A thermal printer on a diner counter prints the night's photos as a receipt; pull the paper to print more and flick it to tear it off.">
  <meta name="theme-color" content="#2a2623">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='2' width='26' height='12' rx='4' fill='%231d1b1a'/%3E%3Crect x='9' y='10' width='14' height='20' fill='%23f1eee6'/%3E%3Cpath d='M11 15h10M11 18h6M11 21h10M11 24h8' stroke='%232a2c33' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="A thermal receipt printer on a diner counter prints the night's photos as a receipt. Drag the paper toward you, or scroll down, to pull it out and print more; flick it sideways or snap it back toward the printer to tear it off. Select a printed photo to see the original. Down arrow or Space pulls out about one photo, T or Backspace tears the receipt off, Enter opens the latest printed photo, Left and Right arrows step through the photos, and Escape closes it."></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <dialog id="box" class="box" aria-labelledby="title">
    <img id="box-img" alt="">
    <div class="caption">
      <button id="prev" type="button" aria-label="Previous photo">‹</button>
      <p><span id="time"></span><strong id="title"></strong></p>
      <button id="next" type="button" aria-label="Next photo">›</button>
      <button id="close" type="button" aria-label="Back to the receipt">×</button>
    </div>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
